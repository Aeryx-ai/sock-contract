syntax = "proto3";

package sock.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aeryx-ai/sock-contract/gen/go/sock/v1;sockv1";

// Account is a human or a puppet. Exactly one of the kind fields is set.
message Account {
  // Server-assigned UUID.
  string id = 1;
  // 1 to 64 characters.
  string display_name = 2;
  oneof kind {
    Human human = 3;
    Puppet puppet = 4;
  }
}

message Human {
  // Lowercase [a-z0-9_], 3 to 20 characters. Unique among humans.
  string handle = 1;
}

message Puppet {
  // Account id of the owning human.
  string owner_id = 1;
  // 1 to 64 characters. Unique per owner.
  string name = 2;
  // Operated by the server: the moderation puppet or the support puppet.
  // Not erasable and not addable to groups. Clients offer no erase
  // or add action on it and leave it out of member pickers. A human may open
  // a direct with the support puppet (GetMeResponse.support_account_id).
  bool system = 3;
  // Set when the puppet was created by an agent platform's OAuth consent,
  // and only for its owner (ListPuppets, ExportIdentityData);
  // unset in every other response, so a platform name never reaches
  // anyone else. Clients label erasing it "Disconnect <client_name>".
  Connector connector = 4;
}

// The agent platform behind a connector puppet.
message Connector {
  // The OAuth client's display name: from its metadata document or its
  // registration. Chosen by whoever published or registered the client
  // unless verified is true; clients show "<client_name> (unverified)"
  // then.
  string client_name = 1;
  // The hub lists the client in SOCK_OAUTH_VERIFIED_CLIENTS: set by the
  // hub from the client id it fetched the document from, never from
  // anything the client supplied.
  bool verified = 2;
  // The grant is unrevoked. False for a kept puppet (its grant revoked by
  // the client, refresh reuse or code replay): the connection already
  // ended, and erasing deletes the puppet and its history.
  bool live = 3;
}

// Device is one credential: a human's Sign in with Apple session, a human's
// machine key, or one of a puppet's tokens. kind says which.
message Device {
  // Server-assigned UUID. Appears inside the token.
  string id = 1;
  string account_id = 2;
  // 1 to 64 characters. Client-supplied for human sessions, owner-supplied
  // for puppet tokens.
  string label = 3;
  google.protobuf.Timestamp created_at = 4;
  // Fixed at issue; the token prefix follows it. UNSPECIFIED only from a
  // server that predates device kinds: read it as SESSION for a human's device and
  // PUPPET_TOKEN for a puppet's.
  DeviceKind kind = 5;
}

// DeviceKind says what a device is. The token prefix and the kind
// always agree; a mismatch never authenticates.
enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  // A human's Sign in with Apple session, app or CLI: sock_st_.
  DEVICE_KIND_SESSION = 1;
  // A puppet's token, a connector puppet's included: sock_pt_.
  DEVICE_KIND_PUPPET_TOKEN = 2;
  // A human's machine key: sock_mk_. May only create, list, mint tokens for,
  // erase, archive and unarchive the puppets it created. Never
  // evicted by a sign-in.
  DEVICE_KIND_MACHINE_KEY = 3;
}

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  // Exactly two members, fixed for life. At most one per pair of accounts.
  CONVERSATION_KIND_DIRECT = 1;
  // 1 to 20 members.
  CONVERSATION_KIND_GROUP = 2;
}

message Conversation {
  string id = 1;
  ConversationKind kind = 2;
  // Account ids of the current members.
  repeated string member_ids = 3;
  // The caller's read marker: the highest seq read on any of the caller's
  // devices, 0 when none. Filled for human callers only; never another
  // member's.
  int64 read_through_seq = 4;
  // An active puppet is a member, so humans may Send. False: the
  // conversation is read-only for humans (NO_ACTIVE_PUPPET); it becomes
  // writable again when an active puppet returns.
  bool humans_can_post = 5;
}

message Message {
  // Server-assigned UUID.
  string id = 1;
  string conversation_id = 2;
  // Per-conversation order, server-assigned, gapless, starting at 1.
  int64 seq = 3;
  string sender_id = 4;
  // Server receive time. The display timestamp.
  google.protobuf.Timestamp sent_at = 5;
  oneof body {
    // UTF-8 Markdown, 1 to 65536 bytes.
    string text = 10;
  }
  // The server's HMAC-SHA256 over (id, conversation_id, seq, sender_id,
  // sent_at, SHA-256(text)). Opaque to clients: stored with the message and
  // sent back as report evidence, which the server accepts only with a valid
  // tag. 32 bytes.
  bytes evidence_tag = 6;
}

enum ApnsEnvironment {
  APNS_ENVIRONMENT_UNSPECIFIED = 0;
  APNS_ENVIRONMENT_SANDBOX = 1;
  APNS_ENVIRONMENT_PRODUCTION = 2;
}
